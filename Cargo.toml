[workspace]
members = [
    "crates/unllm-core",
    "crates/unllm-openai",
    "crates/unllm-anthropic",
    "crates/unllm-gemini",
    "crates/unllm",
    "crates/unllm-gateway",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["unllm contributors"]
description = "A protocol-neutral model and gateway for large language model APIs"
readme = "README.md"
keywords = ["llm", "openai", "anthropic", "gemini", "gateway"]
categories = ["api-bindings", "web-programming"]

[workspace.dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
axum = { version = "0.8.6", features = ["json", "macros", "multipart"] }
base64 = "0.22.1"
bytes = { version = "1.10.1", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive", "env"] }
futures-core = "0.3.31"
futures-util = "0.3.31"
http = "1.3.1"
http-body-util = "0.1.3"
indexmap = { version = "2.11.4", features = ["serde"] }
ipnet = "2.11.0"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
schemars = { version = "0.8.22", features = ["bytes"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "0.9.7"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = { version = "=2.5.4", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = "warn"
